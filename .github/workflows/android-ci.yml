name: Android CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR に連続 push したら古い実行をキャンセルする
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle のキャッシュと wrapper の検証を行う
      - uses: gradle/actions/setup-gradle@v4

      # Firebase の google-services.json は不要（まだ未接続。接続後も CI では使わない構成にする）
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
