name: Android CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR に連続 push したら古い実行をキャンセルする
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 画面側は Repository 経由でデータを扱う（docs/DATA_CONTRACT.md §1）。Firebase は data/remote/ の中だけで使う
      - name: Check UI code does not use Firebase directly
        run: |
          base=app/src/main/java/jp/plesion/app
          if grep -rn "import com\.google\.firebase" "$base/feature" "$base/navigation" "$base/core/ui"; then
            echo "::error::feature/ navigation/ core/ui/ から Firebase を直接使わず、data/repository/ の Repository を使ってください"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle のキャッシュと wrapper の検証を行う
      - uses: gradle/actions/setup-gradle@v4

      # Firebase の google-services.json は不要（まだ未接続。接続後も CI では使わない構成にする）
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
